apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "giantswarm-repo-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "giantswarm-repo-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "giantswarm-repo-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "giantswarm-repo-manager.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "giantswarm-repo-manager.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen=:8080
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: VALKEY_ADDR
              value: {{ include "giantswarm-repo-manager.valkeyAddress" . | quote }}
            - name: INVENTORY_CONNECT_TIMEOUT
              value: {{ .Values.inventory.connectTimeout | quote }}
            - name: MCP_PATH
              value: {{ .Values.mcp.path | quote }}
            - name: INVENTORY_ORG
              value: {{ .Values.inventory.org | quote }}
            - name: SWEEP_INTERVAL
              value: {{ .Values.inventory.sweep.interval | quote }}
            - name: SWEEP_ENGINE_CHECKS
              value: {{ .Values.inventory.sweep.engineChecks | quote }}
            - name: SWEEP_CONCURRENCY
              value: {{ .Values.inventory.sweep.concurrency | int64 | quote }}
            - name: GRAPHQL_BUDGET_FLOOR
              value: {{ .Values.inventory.sweep.graphqlBudgetFloor | int64 | quote }}
            - name: SWEEP_TEAMS
              value: {{ join "," .Values.inventory.sweep.teams | quote }}
            - name: RENOVATE_ACTIVE_DAYS
              value: {{ .Values.inventory.renovate.activeDays | int64 | quote }}
            - name: RECONCILER_POLL_INTERVAL
              value: {{ .Values.inventory.reconciler.pollInterval | quote }}
            - name: RECONCILER_WORKFLOW
              value: {{ .Values.inventory.reconciler.workflow | quote }}
            {{- if .Values.oauth.enabled }}
            - name: OAUTH_ENABLED
              value: "true"
            - name: OAUTH_BASE_URL
              value: {{ include "giantswarm-repo-manager.oauthBaseURL" . | quote }}
            - name: OAUTH_AUTHORIZATION_SERVER
              value: {{ .Values.muster.mcpServer.auth.authorizationServer.issuer | quote }}
            {{- end }}
            {{- if .Values.githubApp.existingSecret }}
            {{- /* int64: Helm reads a large number as a float and would render 1.7e+07 */}}
            - name: GITHUB_APP_ID
              value: {{ .Values.githubApp.appID | int64 | quote }}
            - name: GITHUB_APP_INSTALLATION_ID
              value: {{ .Values.githubApp.installationID | int64 | quote }}
            - name: GITHUB_APP_PRIVATE_KEY_FILE
              value: /etc/giantswarm-repo-manager/github-app/private-key
            {{- end }}
            {{- with .Values.githubApp.apiURL }}
            - name: GITHUB_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.circleci.existingSecret }}
            - name: CIRCLECI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: token
            {{- end }}
            - name: TEAM_FILES_REPOSITORY
              value: {{ .Values.teamFiles.repository | quote }}
            - name: TEAM_FILES_REF
              value: {{ .Values.teamFiles.ref | quote }}
            {{- if .Values.reviews.gatewayURL }}
            - name: REVIEWS_URL
              value: {{ .Values.reviews.gatewayURL | quote }}
            - name: REVIEWS_TOKEN_FILE
              value: /var/run/secrets/klaus-gateway/token
            - name: REVIEWS_CHANNELS
              value: {{ include "giantswarm-repo-manager.reviewChannels" . | quote }}
            {{- with .Values.reviews.debugChannel }}
            - name: REVIEWS_DEBUG_CHANNEL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.githubApp.existingSecret }}
            - name: github-app
              mountPath: /etc/giantswarm-repo-manager/github-app
              readOnly: true
            {{- end }}
            {{- if .Values.reviews.gatewayURL }}
            - name: klaus-gateway-token
              mountPath: /var/run/secrets/klaus-gateway
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.githubApp.existingSecret }}
        - name: github-app
          secret:
            secretName: {{ .Values.githubApp.existingSecret }}
            items:
              - key: private-key
                path: private-key
        {{- end }}
        {{- if .Values.reviews.gatewayURL }}
        - name: klaus-gateway-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.reviews.audience | quote }}
                  expirationSeconds: 600
                  path: token
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
