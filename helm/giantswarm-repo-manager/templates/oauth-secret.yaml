{{- if and .Values.oauth.enabled (not (include "giantswarm-repo-manager.oauthExistingSecret" .)) }}
{{- /*
The Dex client secret from the values, for installs without a Secret of their
own (oauth.existingSecret / global.identity.existingSecret).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "giantswarm-repo-manager.oauthSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "giantswarm-repo-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  dex-client-secret: {{ required "oauth.dex.clientSecret or oauth.existingSecret is required with oauth.enabled" .Values.oauth.dex.clientSecret | quote }}
{{- end }}
