# Default values for giantswarm-repo-manager.

# -- Platform-wide values an umbrella chart shares with every component and
# Helm forwards here. `oauth.*` reads the identity contract as its defaults:
# `global.identity.issuerUrl`, `global.identity.clientId`,
# `global.identity.existingSecret`, `global.identity.ca.secretName` / `.key`,
# and `global.domain` for the OAuth base URL. Empty here; a standalone install
# sets `oauth.*` directly.
global: {}  # @schema type: object; additionalProperties: true

# -- Number of replicas. The server holds its state in Valkey; more than one
# is fine.
replicaCount: 1

image:
  # -- Image registry.
  registry: gsoci.azurecr.io
  # -- Image repository.
  repository: giantswarm/giantswarm-repo-manager
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""

# -- Image pull secrets.
imagePullSecrets: []
# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified app name.
fullnameOverride: ""

# -- The inventory store: the Giant Swarm `valkey` app as a subchart (its
# values live under `valkey.valkey`, the upstream chart's). One replica on an
# RWO volume with `Recreate`, so a rollout does not deadlock on the volume;
# the store is a cache — every record is rebuilt from the team files and
# GitHub — so the restart gap costs nothing. Set `valkey.enabled: false` and
# `inventory.valkeyAddress` to use a Valkey outside the release.
valkey:  # @schema skipProperties: true; additionalProperties: true
  enabled: true
  ciliumNetworkPolicy:
    enabled: false
  vpa:
    enabled: false
  valkey:
    fullnameOverride: giantswarm-repo-manager-valkey
    replicaCount: 1
    deploymentStrategy: Recreate
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"

inventory:
  # -- Address (`host:port`) of the Valkey the inventory lives in, passed to
  # the server as `VALKEY_ADDR`. Empty derives the subchart's Service,
  # `<valkey.valkey.fullnameOverride>.<namespace>.svc:6379`; required when
  # `valkey.enabled` is false.
  valkeyAddress: ""

mcp:
  # -- MCP streamable-HTTP endpoint path.
  path: /mcp

oauth:
  # -- Make the server an OAuth 2.1 resource server (mcp-oauth): the MCP
  # endpoint requires a bearer token the platform Dex issued, and every call
  # carries the caller's identity and id_token — the subject token of the
  # broker exchange that releases the caller's GitHub grant. muster forwards
  # the session's id_token byte-identical (MCPServer `auth.forwardToken`,
  # rendered below); it is validated against Dex's JWKS when its audience is
  # in `trustedAudiences`. Off: anonymous — no caller, no grant, tools report
  # so; only for a server nothing but a trusted proxy can reach.
  enabled: false
  # -- Public base URL of this server: the issuer of its own OAuth metadata
  # (https, or http on loopback). Empty derives
  # `https://<fullname>.<global.domain>` when `global.domain` is set.
  baseURL: ""
  dex:
    # -- Dex issuer URL. Empty falls back to `global.identity.issuerUrl`.
    issuerURL: ""
    # -- Dex OAuth client ID this server is registered as. Empty falls back to
    # `global.identity.clientId`.
    clientID: ""
    # -- Dex OAuth client secret (prefer `oauth.existingSecret`).
    clientSecret: ""
    # -- Let the issuer resolve to a private or loopback address (an
    # in-cluster Dex).
    allowPrivateURLs: false
    # -- Secret with the CA of a Dex that serves a private certificate;
    # mounted and passed as `DEX_CA_FILE`. Empty name falls back to
    # `global.identity.ca.secretName` / `global.identity.ca.key`.
    caSecret:
      name: ""
      key: ca.crt
  # -- Existing Secret with the Dex client secret under `dex-client-secret`.
  # Empty falls back to `global.identity.existingSecret`; without that, the
  # chart renders a Secret from `oauth.dex.clientSecret`.
  existingSecret: ""
  # -- OAuth client IDs whose Dex id_tokens are accepted as bearer tokens
  # (SSO token forwarding). Empty falls back to `[global.identity.clientId]`.
  # The server trusts the union of this list and
  # `muster.mcpServer.auth.requiredAudiences`.
  trustedAudiences: []
  sso:
    # -- Let the IdP's JWKS endpoint resolve to a private address when
    # validating forwarded tokens (an in-cluster Dex).
    allowPrivateIPs: false
  # -- Accept unauthenticated dynamic client registration (labs only).
  allowPublicClientRegistration: false

muster:
  # -- muster's base URL as reached from the pod (for example
  # `http://muster.muster.svc:8090`): the broker exchange goes to
  # `<url>/oauth/token`. Empty leaves the broker client off; `get_info`
  # reports it.
  url: ""
  mcpServer:
    # -- Register this server with muster by rendering an
    # `mcpservers.muster.giantswarm.io` CR in the release namespace. Tools then
    # appear as `x_<name>_<tool>`.
    enabled: false
    # -- MCPServer CR name (drives the tool prefix).
    name: giantswarm-repo-manager
    # -- Start the server connection when muster initializes.
    autoStart: true
    # -- Human-readable description shown by muster.
    description: Giant Swarm's repository set-up service — the giantswarm org's repositories, every write as the person
    # -- Extra labels on the MCPServer CR.
    labels: {}  # @schema additionalProperties: true
    # -- How muster authenticates to this server; rendered only with
    # `oauth.enabled`. `forwardToken` makes muster forward the session's Dex
    # id_token byte-identical. `requiredAudiences` are extra audiences that
    # token must carry (the Dex cross-client audience of the platform, e.g.
    # `dex-k8s-authenticator`); they are trusted as bearer audiences by
    # construction.
    auth:
      forwardToken: true
      requiredAudiences: []

broker:
  # -- This server's client id at muster's token-exchange broker
  # (`tokenExchangeBroker.brokerClients.<id>`, allowed audience `github`).
  clientID: giantswarm-repo-manager
  # -- Existing Secret with the broker client credentials under
  # `client-secret` (and optionally `client-id`) — the same Secret muster's
  # `brokerClients.<id>.clientCredentialsSecretRef` reads. Empty leaves the
  # broker client off.
  existingSecret: ""
  # -- Broker target that releases the person's GitHub grant
  # (`tokenExchangeBroker.targets.<audience>.grantIssuer`).
  audience: github

githubApp:
  # -- The App used for unattended, read-only inventory reads (the
  # giantswarm-align-files App) and its installation on the org. 0 leaves the
  # App identity off.
  appID: 0
  installationID: 0
  # -- Existing Secret with the App's PEM private key under `private-key`.
  existingSecret: ""
  # -- GitHub API base URL; empty is api.github.com.
  apiURL: ""

circleci:
  # -- Existing Secret with the CircleCI API token (read scope) under `token`,
  # passed as `CIRCLECI_API_TOKEN`. Empty leaves it unset.
  existingSecret: ""

serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- Annotations on the ServiceAccount.
  annotations: {}  # @schema additionalProperties: true
  # -- ServiceAccount name (generated when empty).
  name: ""

# -- Annotations on the pod.
podAnnotations: {}  # @schema additionalProperties: true
# -- Labels on the pod.
podLabels: {}  # @schema additionalProperties: true

# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port (the container listens on 8080).
  port: 8080

# -- Container resources.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -- Extra container arguments.
extraArgs: []
# -- Extra environment variables.
extraEnv: []  # @schema item: object ; itemProperties: {name: {type: string}, value: {type: string}, valueFrom: {type: object, additionalProperties: true}}

# -- Node selector.
nodeSelector: {}  # @schema additionalProperties: true
# -- Tolerations.
tolerations: []  # @schema item: object ; itemProperties: {key: {type: string}, operator: {type: string}, value: {type: string}, effect: {type: string}, tolerationSeconds: {type: integer}}
# -- Affinity.
affinity: {}  # @schema additionalProperties: true
