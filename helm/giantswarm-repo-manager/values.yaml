# Default values for giantswarm-repo-manager.

# -- Platform-wide values an umbrella chart shares with every component and
# Helm forwards here; this chart reads none of them.
global: {}  # @schema type: object; additionalProperties: true

# -- Number of replicas. The server holds its state in Valkey; more than one
# is fine.
replicaCount: 1

image:
  # -- Image registry.
  registry: gsoci.azurecr.io
  # -- Image repository.
  repository: giantswarm/giantswarm-repo-manager
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""

# -- Image pull secrets.
imagePullSecrets: []
# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified app name.
fullnameOverride: ""

# -- The inventory store: the Giant Swarm `valkey` app as a subchart (its
# values live under `valkey.valkey`, the upstream chart's). One replica on an
# RWO volume with `Recreate`, so a rollout does not deadlock on the volume;
# the store is a cache — every record is rebuilt from the team files and
# GitHub — so the restart gap costs nothing. Set `valkey.enabled: false` and
# `inventory.valkeyAddress` to use a Valkey outside the release.
valkey:  # @schema skipProperties: true; additionalProperties: true
  enabled: true
  ciliumNetworkPolicy:
    enabled: false
  vpa:
    enabled: false
  valkey:
    fullnameOverride: giantswarm-repo-manager-valkey
    replicaCount: 1
    deploymentStrategy: Recreate
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    # The restricted Pod Security Standard: the valkey chart's init container
    # and metrics exporter carry no security context of their own, so an
    # installation enforcing PSS restricted (Kyverno: disallow-privilege-
    # escalation, restrict-seccomp-strict) denies the Deployment without
    # these. muster-valkey's values, so every installation passes without
    # overlay values.
    podSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    metrics:
      exporter:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault

inventory:
  # -- Address (`host:port`) of the Valkey the inventory lives in, passed to
  # the server as `VALKEY_ADDR`. Empty derives the subchart's Service,
  # `<valkey.valkey.fullnameOverride>.<namespace>.svc:6379`; required when
  # `valkey.enabled` is false.
  valkeyAddress: ""
  # -- How long the server waits for the store at start (a Go duration),
  # retrying with backoff, before it gives up and exits; it serves meanwhile,
  # liveness passing and readiness failing until the store answers, so a
  # Valkey that starts after the manager — a volume binding late, a restart —
  # costs no container restart within the window. `"0"` waits for ever.
  connectTimeout: 5m
  # -- The GitHub organization the inventory covers.
  org: giantswarm
  sweep:
    # -- Full sweep over the org every interval (a Go duration); `"0"` turns
    # the schedule off. The first sweep runs at start when the last one is
    # older than the interval.
    interval: 24h
    # -- Run the engine's set-up checks in read mode for every accepted
    # declaration during a sweep (REST as the App, about ten calls per
    # repository). A `refresh_repository` always runs them.
    engineChecks: true
    # -- Parallel engine reads during a sweep.
    concurrency: 4
    # -- Stop a sweep cleanly when the GraphQL budget's remaining points fall
    # below this; 0 never stops.
    graphqlBudgetFloor: 0
    # -- GitHub team slugs whose members may start a sweep on demand with the
    # tool `sweep_inventory` (membership checked on GitHub as the caller): the
    # teams that own the manager and the reconciler. Passed as `SWEEP_TEAMS`.
    teams:
      - team-bumblebee
      - team-planeteers
  engine:
    # -- Numeric id of the devctl GitHub App (the App's settings page; not the
    # client id), the reconciler's bypass actor on the ruleset `devctl: default
    # branch`. 0, the default: the engine's read-mode protection step compares
    # the ruleset's rules and leaves its bypass list uncompared, the summary
    # saying `bypass actors not compared`. GitHub shows a ruleset's bypass
    # actors to identities that administer the repository, and the inventory
    # App reads: with the id the step would compare an empty list against the
    # reconciler's and report every aligned repository as drifted. Set it only
    # for a read identity that sees the bypass actors. Passed as
    # `DEVCTL_APP_ID`.
    devctlAppID: 0
  releases:
    # -- Follow the latest release of every declared repository from its tag
    # to the end of the tag's own CircleCI pipeline, reading every interval (a
    # Go duration): one GraphQL query over the most recently pushed
    # repositories per pass, and CircleCI reads for the releases still
    # running. A red pipeline, or none within `grace`, is one notice to the
    # owning team's `standupChannel`, told once; a rerun that goes green is
    # silent. `"0"` turns the watch off. Public repositories are read without
    # a token; a private one needs `circleci.existingSecret`, else its release
    # reads `unchecked`.
    interval: 5m
    # -- How long after its creation a release may have no CircleCI pipeline
    # before it is a missed build (`missed-tag-build`, told once).
    grace: 10m
  reconciler:
    # -- Read the reconciler workflow's completed runs from GitHub as the
    # inventory App every interval (a Go duration) and store each run's
    # `reconcile-<repository>` artifact as the repository's `setup.lastRun`;
    # every 30 s while an Align now (`align_repository`) is pending.
    # `"0"` turns the poller off. Nothing reaches the server from the
    # workflow: the App needs Actions read on `teamFiles.repository`.
    pollInterval: 5m
    # -- The reconciler's workflow file in `teamFiles.repository`: the one
    # `align_repository` dispatches and the poller reads the runs of.
    workflow: reconcile-repositories.yaml
  renovate:
    # -- Days within which a Renovate pull request or commit counts as
    # Renovate activity — `list_repositories`' Renovate state `active`, else
    # `inactive`. Passed as `RENOVATE_ACTIVE_DAYS`.
    activeDays: 180

teamFiles:
  # -- The repository that holds the team files (`repositories/<team>.yaml`,
  # the desired state) and the policy files (`repository-setup/<team>.yaml`);
  # every write is a pull request against it, opened as the caller.
  repository: giantswarm/github
  # -- The branch the files are read from and pull requests target.
  ref: main

circleci:
  # -- Existing Secret with a CircleCI API token under `token`, for the release
  # watch to read the tag pipelines of private repositories (a personal token
  # of a read-only identity: CircleCI has no scoped tokens). Empty reads
  # anonymously, which CircleCI answers for public projects alone; a private
  # repository's release then reads `unchecked` and the team hears nothing
  # about it.
  existingSecret: ""

reviews:
  # -- klaus-gateway's base URL as reached from the pod (for example
  # `http://klaus-gateway.agent-platform.svc:8080`): lifecycle and transfer
  # asks go to `POST /reviews` into the team's `slackChannel`, notices (the
  # giving team's transfer notice, what a reconciler run tells the team) to
  # `POST /notices` into its `standupChannel`, authenticated with this pod's
  # projected ServiceAccount token for `audience`. Empty leaves the asks
  # undelivered; the tools say so and approving on GitHub stays equivalent.
  # `get_info` reports it as `reviews.url` beside `reviews.configured`.
  gatewayURL: ""
  # -- The audience of the projected token — the gateway's `reviews.audience`;
  # this ServiceAccount must be in its `reviews.allowedCallers`. `get_info`
  # reports it as `reviews.audience`.
  audience: klaus-gateway
  # -- Slack channel IDs by the channel names a team's policy file carries:
  # `slackChannel` (asks with an Approve button) and `standupChannel`
  # (notices). The gateway takes IDs, so every channel a policy file names
  # needs an entry (`team-x: C…`, `standup-x: C…`) unless the file carries
  # the ID itself.
  channels: {}  # @schema additionalProperties: true
  # -- A channel that receives every ask and notice instead of the channel the
  # policy file names, the text closing with that channel (`… (for #team-x)`):
  # a test round of the flows without disturbing the teams. A name `channels`
  # resolves or a Slack channel ID; empty delivers to the policy file's channel.
  debugChannel: ""

mcp:
  # -- MCP streamable-HTTP endpoint path.
  path: /mcp

oauth:
  # -- Require a GitHub user token as the bearer of every MCP request, verified
  # with `GET /user`; the server then acts as that person. Behind muster the
  # token is the person's own: muster runs the consent for the GitHub App
  # `giantswarm-repo-manager` once (the MCPServer's `authorizationServer` pin
  # under `muster.mcpServer.auth`), stores and refreshes the user token and
  # puts it on every call. Off: anonymous — no caller, nothing acts as a
  # person, the tools say so; only for a server nothing but a trusted proxy
  # can reach.
  enabled: false
  # -- URL muster reaches this server at, without the MCP path: the resource
  # of its OAuth protected-resource metadata. Empty derives the in-cluster
  # Service URL, `http://<fullname>.<namespace>.svc.cluster.local:<service.port>`.
  baseURL: ""

muster:
  mcpServer:
    # -- Register this server with muster by rendering an
    # `mcpservers.muster.giantswarm.io` CR in the release namespace. Tools then
    # appear as `x_<name>_<tool>`.
    enabled: false
    # -- MCPServer CR name (drives the tool prefix).
    name: giantswarm-repo-manager
    # -- Start the server connection when muster initializes.
    autoStart: true
    # -- Seconds muster waits for one call before it cancels it (the CR's
    # `spec.timeout`; muster's own default is 30, the CRD allows 1–300). 180
    # because `create_repository` in `mode: commit` does its writes in one
    # call — create the repository, fetch and render the template, push the
    # scaffold, open the pull request — `watch_repository` blocks up to its
    # `timeout` of at most 150 s, and `align_repository` and `set_lifecycle`
    # with the ask come close to muster's default as well.
    timeout: 180  # @schema minimum: 1; maximum: 300
    # -- Human-readable description shown by muster.
    description: Giant Swarm's repository set-up service — the giantswarm org's repositories, every write as the person
    # -- Extra labels on the MCPServer CR.
    labels: {}  # @schema additionalProperties: true
    # -- How muster authenticates to this server; rendered only with
    # `oauth.enabled`: `auth.type: oauth` with the GitHub App
    # `giantswarm-repo-manager` pinned as the authorization server — the
    # pattern of the `github` and `pro` servers on the platform. GitHub
    # publishes no discovery document, so the endpoints are named; the App's
    # client credentials come from a Secret; no `scopes` for GitHub (the App's
    # permissions are the App's), a `scopes` value for an authorization server
    # that needs one. muster runs the consent once per person and puts their
    # user token on every call.
    auth:
      authorizationServer:
        # -- The issuer identity the person's grant is filed under: the App's
        # own, so the login App's GitHub grant stays separate.
        issuer: https://github.com/apps/giantswarm-repo-manager
        # -- The issuer the authorization server puts in the RFC 9207 `iss`
        # parameter of its authorization response — GitHub's is
        # `https://github.com/login/oauth` for every App, while `issuer` stays
        # the App's own identity the grant is filed under (muster#1277). Empty
        # omits the field.
        expectedIssuer: https://github.com/login/oauth
        # -- GitHub's authorize endpoint.
        authorizationEndpoint: https://github.com/login/oauth/authorize
        # -- GitHub's token endpoint.
        tokenEndpoint: https://github.com/login/oauth/access_token
        # -- The OAuth `scope` parameter of the authorization request
        # (space-separated), only for an authorization server that needs one —
        # a Dex standing in for GitHub in a lab takes
        # `openid profile email offline_access`. Leave empty for GitHub: a
        # GitHub App's permissions are the App's, and the token endpoint takes
        # no scope. Empty omits the field.
        scopes: ""
        clientCredentialsSecretRef:
          # -- Secret with the App's OAuth client under `client-id` and
          # `client-secret`.
          name: giantswarm-repo-manager-oauth-client
          # -- Namespace of that Secret; empty is the release namespace.
          namespace: ""
        # -- `subject`: the grant belongs to the person, not to one login
        # session — every session of theirs (the portal, an agent, a Slack
        # click) carries the same token.
        grantScope: subject

githubApp:
  # -- Id of the read-only GitHub App `giantswarm-repo-manager-inventory`, the
  # one identity of the unattended reads: the org sweep, the engine's checks
  # in read mode and the name check of a dry run run as its installation, on
  # its own rate budget. Its permissions, all read: Administration, Contents,
  # Pull requests, Issues, Commit statuses (the `ci/circleci:` contexts on the
  # default branch head), Checks (the check runs on the default branch head:
  # the engine's protection step reads them to learn which conditional checks
  # exist — without it every repository carries the finding `unchecked`, the
  # checks on main not readable with this token), Metadata, Organization
  # members. 0 leaves the unattended reads unconfigured — nothing stands in
  # for the App; the tools that need it say so.
  appID: 0
  # -- The inventory App's installation id on the org.
  installationID: 0
  # -- Existing Secret with the inventory App's PEM private key under
  # `private-key`.
  existingSecret: ""
  # -- GitHub API base URL; empty is api.github.com.
  apiURL: ""

serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- Annotations on the ServiceAccount.
  annotations: {}  # @schema additionalProperties: true
  # -- ServiceAccount name (generated when empty).
  name: ""

# -- Annotations on the pod.
podAnnotations: {}  # @schema additionalProperties: true
# -- Labels on the pod.
podLabels: {}  # @schema additionalProperties: true

# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port (the container listens on 8080).
  port: 8080

# -- Container resources.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -- Extra container arguments.
extraArgs: []
# -- Extra environment variables.
extraEnv: []  # @schema item: object ; itemProperties: {name: {type: string}, value: {type: string}, valueFrom: {type: object, additionalProperties: true}}

# -- Node selector.
nodeSelector: {}  # @schema additionalProperties: true
# -- Tolerations.
tolerations: []  # @schema item: object ; itemProperties: {key: {type: string}, operator: {type: string}, value: {type: string}, effect: {type: string}, tolerationSeconds: {type: integer}}
# -- Affinity.
affinity: {}  # @schema additionalProperties: true
