# Default values for giantswarm-repo-manager.

# -- Platform-wide values an umbrella chart shares with every component and
# Helm forwards here; this chart reads none of them.
global: {}  # @schema type: object; additionalProperties: true

# -- Number of replicas. The server holds its state in Valkey; more than one
# is fine.
replicaCount: 1

image:
  # -- Image registry.
  registry: gsoci.azurecr.io
  # -- Image repository.
  repository: giantswarm/giantswarm-repo-manager
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""

# -- Image pull secrets.
imagePullSecrets: []
# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified app name.
fullnameOverride: ""

# -- The inventory store: the Giant Swarm `valkey` app as a subchart (its
# values live under `valkey.valkey`, the upstream chart's). One replica on an
# RWO volume with `Recreate`, so a rollout does not deadlock on the volume;
# the store is a cache — every record is rebuilt from the team files and
# GitHub — so the restart gap costs nothing. Set `valkey.enabled: false` and
# `inventory.valkeyAddress` to use a Valkey outside the release.
valkey:  # @schema skipProperties: true; additionalProperties: true
  enabled: true
  ciliumNetworkPolicy:
    enabled: false
  vpa:
    enabled: false
  valkey:
    fullnameOverride: giantswarm-repo-manager-valkey
    replicaCount: 1
    deploymentStrategy: Recreate
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"
    # The restricted Pod Security Standard: the valkey chart's init container
    # and metrics exporter carry no security context of their own, so an
    # installation enforcing PSS restricted (Kyverno: disallow-privilege-
    # escalation, restrict-seccomp-strict) denies the Deployment without
    # these. muster-valkey's values, so every installation passes without
    # overlay values.
    podSecurityContext:
      fsGroup: 1000
      runAsGroup: 1000
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    metrics:
      exporter:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault

inventory:
  # -- Address (`host:port`) of the Valkey the inventory lives in, passed to
  # the server as `VALKEY_ADDR`. Empty derives the subchart's Service,
  # `<valkey.valkey.fullnameOverride>.<namespace>.svc:6379`; required when
  # `valkey.enabled` is false.
  valkeyAddress: ""
  # -- How long the server waits for the store at start (a Go duration),
  # retrying with backoff, before it gives up and exits; it serves meanwhile,
  # liveness passing and readiness failing until the store answers, so a
  # Valkey that starts after the manager — a volume binding late, a restart —
  # costs no container restart within the window. `"0"` waits for ever.
  connectTimeout: 5m
  # -- The GitHub organization the inventory covers.
  org: giantswarm
  sweep:
    # -- Full sweep over the org every interval (a Go duration); `"0"` turns
    # the schedule off. The first sweep runs at start when the last one is
    # older than the interval.
    interval: 24h
    # -- Run the engine's set-up checks in read mode for every accepted
    # declaration during a sweep (REST as the App, about ten calls per
    # repository). A `refresh_repository` always runs them.
    engineChecks: true
    # -- Parallel CircleCI and engine reads during a sweep.
    concurrency: 4
    # -- Stop a sweep cleanly when the GraphQL budget's remaining points fall
    # below this; 0 never stops.
    graphqlBudgetFloor: 0
  orphan:
    # -- Stale period of the orphan score in days (no commit by a person, no
    # Renovate activity within it).
    staleDays: 180
  internal:
    # -- Existing Secret with the bearer token of the internal endpoints under
    # `token`: `POST /internal/refresh` (the reconciler workflow's trigger
    # after a run, with the run as `lastRun`) and `/internal/sweep`. Empty
    # disables them (404).
    existingSecret: ""

teamFiles:
  # -- The repository that holds the team files (`repositories/<team>.yaml`,
  # the desired state) and the policy files (`repository-setup/<team>.yaml`);
  # every write is a pull request against it, opened as the caller.
  repository: giantswarm/github
  # -- The branch the files are read from and pull requests target.
  ref: main

reviews:
  # -- klaus-gateway's base URL as reached from the pod (for example
  # `http://klaus-gateway.agent-platform.svc:8080`): lifecycle and transfer
  # asks go to `POST /reviews`, notices and completion messages to
  # `POST /notices`, authenticated with this pod's projected ServiceAccount
  # token for `audience`. Empty leaves the asks undelivered; the tools say so
  # and approving on GitHub stays equivalent.
  gatewayURL: ""
  # -- The audience of the projected token — the gateway's `reviews.audience`;
  # this ServiceAccount must be in its `reviews.allowedCallers`.
  audience: klaus-gateway
  # -- Slack channel IDs by the channel name a team's policy file carries
  # (`slackChannel`): the gateway takes IDs. A policy file that carries the
  # ID itself needs no entry.
  channels: {}  # @schema additionalProperties: true

mcp:
  # -- MCP streamable-HTTP endpoint path.
  path: /mcp

oauth:
  # -- Require a GitHub user token as the bearer of every MCP request, verified
  # with `GET /user`; the server then acts as that person. Behind muster the
  # token is the person's own: muster runs the consent for the GitHub App
  # `giantswarm-repo-manager` once (the MCPServer's `authorizationServer` pin
  # under `muster.mcpServer.auth`), stores and refreshes the user token and
  # puts it on every call. Off: anonymous — no caller, nothing acts as a
  # person, the tools say so; only for a server nothing but a trusted proxy
  # can reach.
  enabled: false
  # -- URL muster reaches this server at, without the MCP path: the resource
  # of its OAuth protected-resource metadata. Empty derives the in-cluster
  # Service URL, `http://<fullname>.<namespace>.svc.cluster.local:<service.port>`.
  baseURL: ""

muster:
  mcpServer:
    # -- Register this server with muster by rendering an
    # `mcpservers.muster.giantswarm.io` CR in the release namespace. Tools then
    # appear as `x_<name>_<tool>`.
    enabled: false
    # -- MCPServer CR name (drives the tool prefix).
    name: giantswarm-repo-manager
    # -- Start the server connection when muster initializes.
    autoStart: true
    # -- Human-readable description shown by muster.
    description: Giant Swarm's repository set-up service — the giantswarm org's repositories, every write as the person
    # -- Extra labels on the MCPServer CR.
    labels: {}  # @schema additionalProperties: true
    # -- How muster authenticates to this server; rendered only with
    # `oauth.enabled`: `auth.type: oauth` with the GitHub App
    # `giantswarm-repo-manager` pinned as the authorization server — the
    # pattern of the `github` and `pro` servers on the platform. GitHub
    # publishes no discovery document, so the endpoints are named; the App's
    # client credentials come from a Secret; no `scopes` (the App's permissions
    # are the App's). muster runs the consent once per person and puts their
    # user token on every call.
    auth:
      authorizationServer:
        # -- The issuer identity the person's grant is filed under: the App's
        # own, so the login App's GitHub grant stays separate.
        issuer: https://github.com/apps/giantswarm-repo-manager
        # -- GitHub's authorize endpoint.
        authorizationEndpoint: https://github.com/login/oauth/authorize
        # -- GitHub's token endpoint.
        tokenEndpoint: https://github.com/login/oauth/access_token
        clientCredentialsSecretRef:
          # -- Secret with the App's OAuth client under `client-id` and
          # `client-secret`.
          name: giantswarm-repo-manager-oauth-client
          # -- Namespace of that Secret; empty is the release namespace.
          namespace: ""
        # -- `subject`: the grant belongs to the person, not to one login
        # session — every session of theirs (the portal, an agent, a Slack
        # click) carries the same token.
        grantScope: subject

githubApp:
  # -- The App used for unattended, read-only inventory reads (the
  # giantswarm-align-files App) and its installation on the org. 0 leaves the
  # App identity off.
  appID: 0
  installationID: 0
  # -- Existing Secret with the App's PEM private key under `private-key`.
  existingSecret: ""
  # -- GitHub API base URL; empty is api.github.com.
  apiURL: ""

circleci:
  # -- Existing Secret with the CircleCI API token (read scope) under `token`,
  # passed as `CIRCLECI_API_TOKEN`. Empty leaves it unset.
  existingSecret: ""

serviceAccount:
  # -- Create a ServiceAccount.
  create: true
  # -- Annotations on the ServiceAccount.
  annotations: {}  # @schema additionalProperties: true
  # -- ServiceAccount name (generated when empty).
  name: ""

# -- Annotations on the pod.
podAnnotations: {}  # @schema additionalProperties: true
# -- Labels on the pod.
podLabels: {}  # @schema additionalProperties: true

# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port (the container listens on 8080).
  port: 8080

# -- Container resources.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -- Extra container arguments.
extraArgs: []
# -- Extra environment variables.
extraEnv: []  # @schema item: object ; itemProperties: {name: {type: string}, value: {type: string}, valueFrom: {type: object, additionalProperties: true}}

# -- Node selector.
nodeSelector: {}  # @schema additionalProperties: true
# -- Tolerations.
tolerations: []  # @schema item: object ; itemProperties: {key: {type: string}, operator: {type: string}, value: {type: string}, effect: {type: string}, tolerationSeconds: {type: integer}}
# -- Affinity.
affinity: {}  # @schema additionalProperties: true
